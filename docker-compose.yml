version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./api_betting.db:/app/api_betting.db
    environment:
      - DATABASE_PATH=/app/data/betting.db
    restart: unless-stopped

