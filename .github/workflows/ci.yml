name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          pytest
      - name: Ruff format check
        run: |
          ruff format --check .
      - name: Ruff lint
        run: |
          ruff check .
      - name: Mypy
        run: |
          mypy sportsbetlang/cli.py linting.py formatting.py
