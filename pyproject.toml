[build-system]
requires = ["setuptools>=65,<76", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "sportsbetlang"
dynamic = ["version"]
description = "Advanced sports betting analytics library with ML and statistical analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "gunicorn>=21.2",
    "mangum>=0.17",
    "functions-framework>=3.5",
    "asgiref>=3.7",
]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<6.0",
    "ruff>=0.6.0,<1.0.0",
    "mypy>=1.8,<2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "gunicorn>=21.2",
    "mangum>=0.17",
    "functions-framework>=3.5",
    "asgiref>=3.7",
]

[project.scripts]
sportsbetlang = "sportsbetlang.cli:main"
betlang = "sportsbetlang.betlang_cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "sportsbetlang.__version__.__version__"}

[tool.setuptools.packages.find]
include = ["sportsbetlang*", "lib*", "tools*"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]
ignore = ["TID252"]

[tool.ruff.lint.isort]
known-first-party = ["sportsbetlang"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
